# Um compose para iniciar o RabbitMQ e posteriormente os serviços de microserviços
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitmq-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq  
  
  payment-service:
    build: 
      context: ./services/payment.service/payment.service.api
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - BUILD_CONFIGURATION=Development
    ports:
      - "5000:8080"
    container_name: online.store.payment-service
    depends_on:
      - rabbitmq
    networks:
      - rabbitmq-network
    volumes:
      - .:/app/payment/publish
      - ~/.aspnet/https:/https:ro

  order-service:
    build: 
      context: ./services/order.service
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - BUILD_CONFIGURATION=Development
    ports:
      - "5001:8080"
    container_name: online.store.order-service
    depends_on:
      - rabbitmq
    networks:
      - rabbitmq-network
    volumes:
      - .:/app/order/publish
      - ~/.aspnet/https:/https:ro
    
  
  warehouse-service:
    build: 
      context: ./services/warehouse.service
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - BUILD_CONFIGURATION=Development
    ports:
      - "5002:8080"
    container_name: online.store.warehouse-service
    depends_on:
      - rabbitmq
    networks:
      - rabbitmq-network
    volumes:
      - .:/app/warehouse/publish
      - ~/.aspnet/https:/https:ro

  delivery-service:
    build: 
      context: ./services/delivery.service/delivery.service.api
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - BUILD_CONFIGURATION=Development
    ports:
      - "5003:8080"
    container_name: online.store.delivery-service
    depends_on:
      - rabbitmq
    networks:
      - rabbitmq-network
    volumes:
      - .:/app/delivery/publish
      - ~/.aspnet/https:/https:ro

networks:
  rabbitmq-network:
    driver: bridge

volumes:
  rabbitmq-data:
    driver: local