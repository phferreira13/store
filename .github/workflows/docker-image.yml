name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-${{ GITHUB_SHA }}:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get commit tag
      id: get_tag
      run: |
        SHA=$(echo $GITHUB_SHA | head -c 7)
        echo "sha=$SHA" >> $GITHUB_OTUPUT

    - name: Build the Docker image - Order Service
      run: docker build . --file order-service-api.Dockerfile --tag order-service-api:${{ steps.get_tag.outputs.sha }}
